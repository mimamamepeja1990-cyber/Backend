<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruta de Reparto</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=9">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="icon" type="image/png" href="icon.png">
  <script>
    window.GOOGLE_MAPS_API_KEY = "__GOOGLE_MAPS_API_KEY__";
  </script>
</head>
<body class="repartidor-body auth-locked">
  <div id="authOverlay" class="auth-overlay" aria-hidden="true">
    <div class="auth-card">
      <div class="auth-brand">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2l3 7h7l-6 5 3 8-7-4-7 4 3-8-6-5h7z" fill="#111827"/></svg>
        <span>Repartidor</span>
      </div>
      <h1>Ingresar</h1>
      <p class="auth-sub">Acceso para repartidores</p>
      <form id="authLoginForm" class="auth-form" autocomplete="on">
        <div class="field">
          <label for="authUser">Usuario</label>
          <input id="authUser" name="username" autocomplete="username" placeholder="Usuario" required />
        </div>
        <div class="field">
          <label for="authPass">Contraseña</label>
          <input id="authPass" name="password" type="password" autocomplete="current-password" placeholder="Contraseña" required />
        </div>
        <label class="auth-show">
          <input id="authShowPass" type="checkbox" />
          Mostrar contraseña
        </label>
        <div id="authError" class="auth-error" role="alert" aria-live="polite"></div>
        <button class="btn primary" type="submit">Ingresar</button>
      </form>
    </div>
  </div>

  <div class="repartidor-shell">
    <header class="repartidor-header">
      <div>
        <h1>Ruta de reparto</h1>
        <div class="repartidor-meta">
          <span>Repartidor: <strong id="driverName">—</strong></span>
          <span>Zona: <strong id="driverZone">—</strong></span>
          <span>Pedidos: <strong id="routeCount">0</strong></span>
        </div>
      </div>
      <div class="repartidor-actions">
        <button id="refreshRouteBtn" class="btn">Actualizar</button>
        <button id="logoutBtn" class="btn">Salir</button>
      </div>
    </header>

    <section id="driverAppCard" class="driver-app-card hidden" aria-live="polite">
      <div class="driver-app-copy">
        <span class="driver-app-kicker">App Android</span>
        <h2>Instala la app del repartidor</h2>
        <p>Si estas desde el telefono, bajala e instalala para usar la version movil directamente.</p>
      </div>
      <div class="driver-app-actions">
        <a id="driverAppInstallBtn" class="btn primary" href="#" download="repartidor-app.apk">Instalar app</a>
      </div>
    </section>

    <div class="repartidor-grid">
      <section class="repartidor-map-card">
        <div id="routeMap"></div>
        <div id="mapStatus" class="map-status hidden"></div>
      </section>

      <section class="repartidor-panel">
        <div class="current-card">
          <div class="current-header">
            <h2 id="currentTitle">Siguiente pedido</h2>
            <span id="currentBadge" class="badge-pill">—</span>
          </div>
          <div id="currentDetails" class="current-details">Cargando ruta...</div>
          <div class="current-actions">
            <button id="navBtn" class="btn">Navegar</button>
            <button id="deliverBtn" class="btn primary">Marcar entregado</button>
            <button id="nextBtn" class="btn">Siguiente</button>
          </div>
        </div>

        <div class="route-list-card">
          <div class="route-list-head">
            <h3>Ruta ordenada</h3>
            <span id="routeProgress" class="muted">—</span>
          </div>
          <div id="routeList" class="route-list"></div>
        </div>
      </section>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="repartidor.js?v=9"></script>
</body>
</html>
